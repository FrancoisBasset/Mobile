<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PokéCross</title>
<style>
:root{--bg:#0b1020;--panel:#141b2d;--line:#2c3755;--text:#eef3ff;--muted:#9aa7c7;--yellow:#ffcb05;--blue:#3b4cca;--cell:34px;--good:#c9f2d5;--bad:#ffd2d2}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}body{background:radial-gradient(circle at 10% 0%,#1d2e69 0,transparent 34%),var(--bg)}
header{padding:18px 16px 12px;position:sticky;top:0;z-index:20;background:rgba(11,16,32,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
h1{font-size:27px;margin:0;letter-spacing:-1px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.bar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}button{border:1px solid var(--line);background:#202a44;color:white;border-radius:11px;padding:10px 12px;font-weight:750}button.primary{background:var(--yellow);color:#332900;border-color:transparent}.pct{margin-left:auto;color:var(--muted);font-size:13px}.progress{height:7px;background:#202a44;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ff9e3d,var(--blue));transition:.2s}
main{padding:14px}.boardwrap{background:rgba(20,27,45,.95);border:1px solid var(--line);border-radius:16px;padding:10px;overflow:auto;box-shadow:0 18px 42px #0005}.grid{display:grid;grid-template-columns:repeat(24,var(--cell));grid-template-rows:repeat(18,var(--cell));gap:2px;width:max-content;margin:auto}.block{width:var(--cell);height:var(--cell)}.cell{width:var(--cell);height:var(--cell);background:#f8fbff;border-radius:4px;position:relative;overflow:hidden}.cell.word{background:#fff2ad}.cell.active{outline:3px solid var(--yellow);z-index:5}.cell.ok{background:var(--good)}.cell.bad{background:var(--bad)}.cell span{position:absolute;top:1px;left:3px;font-size:8px;font-weight:800;color:#58647a;z-index:2;pointer-events:none}.cell input{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;text-transform:uppercase;font-weight:900;font-size:18px;color:#17223b;padding-top:5px}
.tools{display:flex;gap:8px;margin:10px 0 0}.tools button{flex:1;padding:9px 6px}.clues{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}.cluebox{background:rgba(20,27,45,.95);border:1px solid var(--line);border-radius:16px;padding:13px}.cluebox h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:#c7d2ef;margin:0 0 9px}.clue{background:#0f1628;border:1px solid var(--line);padding:10px 11px;border-radius:11px;margin:7px 0;line-height:1.35;font-size:14px}.clue b{color:#ffdc3d;margin-right:7px}.clue.sel{border-color:var(--yellow);box-shadow:0 0 0 2px #ffcb0520}.clue.done{opacity:.48;text-decoration:line-through}.toast{position:fixed;z-index:50;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;background:#202a44;border:1px solid var(--line);padding:11px 15px;border-radius:12px;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){main{max-width:1100px;margin:auto}.clues{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>⚡ PokéCross</h1><div class="sub">Mots croisés Pokémon · 18 noms français</div><div class="bar"><button class="primary" id="check">✓ Vérifier</button><button id="hint">💡 Lettre</button><button id="reveal">👁 Mot</button><button id="reset">↻ Reset</button><span class="pct" id="stat">0/18</span></div><div class="progress"><i id="prog"></i></div></header>
<main><section class="boardwrap"><div class="grid" id="grid"></div><div class="tools"><button id="minus">− Zoom</button><button id="plus">+ Zoom</button></div></section><section class="clues"><div class="cluebox"><h2>Horizontal</h2><div id="across"></div></div><div class="cluebox"><h2>Vertical</h2><div id="down"></div></div></section></main><div class="toast" id="toast"></div>
<script>
const W=[
["CARAPUCE","Starter Eau de Kanto ressemblant à une petite tortue.",0,6,"down",1],
["LUCARIO","Pokémon Combat/Acier capable de percevoir l'aura.",2,2,"across",2],
["GRODOUDOU","Évolution de Rondoudou, Pokémon Normal/Fée rose et rond.",4,1,"down",3],
["PIKACHU","Pokémon Souris électrique, mascotte emblématique de la licence.",4,6,"across",4],
["BULBIZARRE","Starter Plante/Poison de Kanto portant une graine sur son dos.",5,14,"down",5],
["GARDEVOIR","Pokémon Psy/Fée élégant, évolution possible de Tarsal.",5,16,"down",6],
["POUSSACHA","Starter Plante de Paldea ressemblant à un chat.",6,0,"across",7],
["AMPHINOBI","Évolution finale de Grenousse, rapide Pokémon Eau/Ténèbres.",6,8,"down",8],
["DRACAUFEU","Évolution finale de Salamèche, célèbre Pokémon cracheur de feu.",6,10,"down",9],
["ECTOPLASMA","Pokémon Spectre/Poison à l'immense sourire malicieux.",6,12,"down",10],
["MEWTWO","Pokémon légendaire créé artificiellement à partir de l'ADN de Mew.",6,21,"down",11],
["RONFLEX","Pokémon connu pour dormir énormément et bloquer des routes.",7,16,"across",12],
["GRENOUSSE","Pokémon Crapobulle, starter Eau de Kalos.",9,5,"down",13],
["CHOCHODILE","Starter de type Feu de Paldea, petit crocodile très gourmand.",9,7,"across",14],
["MEW","Pokémon fabuleux de Kanto, réputé contenir l'ADN de nombreux Pokémon.",10,19,"down",15],
["COIFFETON","Starter Eau de Paldea au plumage soigneusement coiffé.",11,0,"across",16],
["EVOLI","Pokémon célèbre pour ses nombreuses évolutions possibles.",11,19,"across",17],
["MIMIQUI","Pokémon Spectre/Fée caché sous un déguisement ressemblant à Pikachu.",14,0,"across",18]
].map(x=>({a:x[0],clue:x[1],r:x[2],c:x[3],d:x[4],n:x[5]}));
const R=18,C=24,g=document.getElementById('grid'),cells=new Map(),occ=new Map(),starts=new Map();let active=null,activeCell=null,zoom=+(localStorage.pcZoom||34);document.documentElement.style.setProperty('--cell',zoom+'px');
const K=(r,c)=>r+','+c, coords=w=>[...w.a].map((_,i)=>[w.r+(w.d==='down'?i:0),w.c+(w.d==='across'?i:0)]);
W.forEach(w=>{starts.set(K(w.r,w.c),w.n);coords(w).forEach(([r,c],i)=>{let k=K(r,c);if(!occ.has(k))occ.set(k,{l:w.a[i],ws:[]});occ.get(k).ws.push(w.n)})});
for(let r=0;r<R;r++)for(let c=0;c<C;c++){let k=K(r,c);if(!occ.has(k)){let b=document.createElement('div');b.className='block';g.append(b);continue}let d=document.createElement('div');d.className='cell';if(starts.has(k)){let s=document.createElement('span');s.textContent=starts.get(k);d.append(s)}let i=document.createElement('input');i.maxLength=1;i.inputMode='text';i.autocomplete='off';i.dataset.r=r;i.dataset.c=c;i.value=localStorage.getItem('pc:'+k)||'';d.append(i);g.append(d);cells.set(k,{d,i,r,c});i.onfocus=()=>selectCell(r,c);i.onclick=()=>selectCell(r,c,true);i.oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(-1);localStorage.setItem('pc:'+k,e.target.value);d.classList.remove('ok','bad');update();if(e.target.value)move(1)};i.onkeydown=keyDown}
function clueLists(){['across','down'].forEach(dir=>{let host=document.getElementById(dir);W.filter(w=>w.d===dir).forEach(w=>{let d=document.createElement('div');d.className='clue';d.dataset.n=w.n;d.innerHTML='<b>'+w.n+(dir==='across'?'→':'↓')+'</b>'+w.clue;d.onclick=()=>selectWord(w);host.append(d)})})}clueLists();
function find(n){return W.find(w=>w.n===n)}function clearHi(){cells.forEach(x=>x.d.classList.remove('word','active'));document.querySelectorAll('.clue').forEach(x=>x.classList.remove('sel'))}
function selectWord(w,focus=true){active=w;clearHi();coords(w).forEach(([r,c])=>cells.get(K(r,c)).d.classList.add('word'));document.querySelector('.clue[data-n="'+w.n+'"]').classList.add('sel');if(focus){let x=coords(w).map(([r,c])=>cells.get(K(r,c))).find(x=>!x.i.value)||cells.get(K(w.r,w.c));x.i.focus()}}
function selectCell(r,c,toggle=false){activeCell=cells.get(K(r,c));let ns=occ.get(K(r,c)).ws,w=active&&ns.includes(active.n)?active:find(ns[0]);if(toggle&&ns.length>1&&active&&ns.includes(active.n))w=find(ns[(ns.indexOf(active.n)+1)%ns.length]);active=w;clearHi();coords(w).forEach(([rr,cc])=>cells.get(K(rr,cc)).d.classList.add('word'));activeCell.d.classList.add('active');document.querySelector('.clue[data-n="'+w.n+'"]').classList.add('sel')}
function idx(){return !active||!activeCell?-1:coords(active).findIndex(([r,c])=>r===activeCell.r&&c===activeCell.c)}function move(n){let a=coords(active),j=Math.max(0,Math.min(a.length-1,idx()+n)),p=a[j];cells.get(K(p[0],p[1])).i.focus()}
function keyDown(e){if(e.key==='Backspace'&&!e.target.value){e.preventDefault();move(-1);let x=document.activeElement;if(x?.tagName==='INPUT'){x.value='';localStorage.removeItem('pc:'+K(+x.dataset.r,+x.dataset.c))}update()}if(e.key===' '){e.preventDefault();selectCell(+e.target.dataset.r,+e.target.dataset.c,true)}}
function solved(w){return coords(w).every(([r,c],i)=>cells.get(K(r,c)).i.value===w.a[i])}function update(){let n=W.filter(solved).length,filled=[...cells.values()].filter(x=>x.i.value).length;document.getElementById('stat').textContent=n+'/'+W.length;document.getElementById('prog').style.width=Math.round(filled/cells.size*100)+'%';document.querySelectorAll('.clue').forEach(x=>x.classList.toggle('done',solved(find(+x.dataset.n))));if(n===W.length)toast('🎉 Grille terminée !')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(t.tm);t.tm=setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('check').onclick=()=>{let bad=0;cells.forEach((x,k)=>{x.d.classList.remove('ok','bad');if(!x.i.value)return;if(x.i.value===occ.get(k).l)x.d.classList.add('ok');else{x.d.classList.add('bad');bad++}});toast(bad?bad+' lettre(s) incorrecte(s)':'Tout ce qui est rempli est correct ✓');update()};
document.getElementById('hint').onclick=()=>{if(!active)return;let p=coords(active).map(([r,c],i)=>[cells.get(K(r,c)),i,r,c]).find(([x,i])=>x.i.value!==active.a[i]);if(!p)return toast('Mot déjà correct');let[x,i,r,c]=p;x.i.value=active.a[i];localStorage.setItem('pc:'+K(r,c),x.i.value);x.d.classList.add('ok');x.i.focus();update()};
document.getElementById('reveal').onclick=()=>{if(!active)return;coords(active).forEach(([r,c],i)=>{let x=cells.get(K(r,c));x.i.value=active.a[i];localStorage.setItem('pc:'+K(r,c),x.i.value);x.d.classList.add('ok')});update();toast('Pokémon révélé')};
document.getElementById('reset').onclick=()=>{if(!confirm('Effacer toute la grille ?'))return;cells.forEach((x,k)=>{x.i.value='';x.d.classList.remove('ok','bad');localStorage.removeItem('pc:'+k)});update()};
function setZoom(v){zoom=Math.max(26,Math.min(52,v));document.documentElement.style.setProperty('--cell',zoom+'px');localStorage.pcZoom=zoom}document.getElementById('minus').onclick=()=>setZoom(zoom-4);document.getElementById('plus').onclick=()=>setZoom(zoom+4);
selectWord(W[0],false);update();
</script></body></html>
