name: Build PokeCross APK

on:
  pull_request:
    branches:
      - master
    paths:
      - 'pokecross/**'
      - '.github/workflows/pokecross-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokecross
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK structure and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r pokecross/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop fr.francoisbasset.pokecross
            adb shell am start -W -n fr.francoisbasset.pokecross/.MainActivity > /tmp/pokecross-start.txt
            cat /tmp/pokecross-start.txt
            grep -q "Status: ok" /tmp/pokecross-start.txt
            sleep 3
            adb shell pidof fr.francoisbasset.pokecross

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokeCross-verified-apk
          path: pokecross/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
